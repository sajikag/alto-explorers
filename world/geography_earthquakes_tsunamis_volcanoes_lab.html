<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earthquake, Tsunami & Volcano Lab</title>
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#eaf4fa;--card:#ffffff;--ink:#16222e;--ink-dim:#5a6b7b;--rule:#d3e0ea;
--accent:#5da6da;--accent-dim:#dcedf7;--accent-ink:#2f78ad;
--red:#da765d;--green:#5dda89;--green-ink:#1f9a50;--blue2:#5d74da;--pink:#da5d8d;--cyan:#7de4ec;--sand:#f3c77a;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Space Grotesk','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;margin:0}
.wrap{max-width:940px;margin:0 auto;padding:18px 16px 40px}
.langbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.langbtn{font:500 12.5px 'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;border:1px solid var(--rule);background:#fff;color:var(--ink-dim);padding:5px 11px;border-radius:999px;cursor:pointer}
.langbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.back-link{display:inline-block;font-size:12px;color:var(--ink-dim);text-decoration:none;margin-bottom:10px}
.back-link:hover{color:var(--accent);text-decoration:underline}
h1{font-size:30px;line-height:1.15;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{color:var(--ink-dim);margin:6px 0 0;max-width:680px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:20px 0 0}
.tab{font:600 13.5px 'Space Grotesk','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;padding:9px 16px;border:1px solid var(--rule);border-bottom:none;border-radius:10px 10px 0 0;background:#d9e8f2;color:var(--ink-dim);cursor:pointer}
.tab.active{background:var(--card);color:var(--accent-ink);position:relative;top:1px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:0 12px 12px 12px;padding:18px}
.panel[hidden]{display:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.ctrl{margin:0 0 12px}
.ctrl label,.ctrl .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;margin-bottom:3px}
.ctrl .val{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
select,input[type=number]{font:500 14px 'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
.btn{font:600 13px 'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 13px;border-radius:8px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent-ink)}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:8px;overflow:hidden}
.seg button{font:600 12.5px 'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;border:0;background:#fff;color:var(--accent-ink);padding:6px 11px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:#fbfdff}
.stat .k{font-size:11.5px;color:var(--ink-dim)}
.stat .v{font:500 17px 'JetBrains Mono',monospace;color:var(--ink)}
.formula{font-family:'JetBrains Mono','Noto Sans Sinhala','Noto Sans Tamil',monospace;font-size:13.5px;background:#f5f9fc;border:1px solid var(--rule);border-radius:10px;padding:9px 11px;margin:8px 0;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.note{background:var(--accent-dim);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.note b{color:var(--accent-ink)}
.warn{background:#fdeee9;border:1px solid var(--red);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.ok{color:var(--green-ink);font-weight:600}
.bad{color:#c4513a;font-weight:600}
svg{display:block;width:100%;height:auto;max-width:100%}
.fig{background:#fbfdff;border:1px solid var(--rule);border-radius:10px}
.mono{font-family:'JetBrains Mono',monospace}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border:1px solid var(--rule);padding:5px 8px;text-align:center;font-family:'JetBrains Mono',monospace}
table.t td:first-child{text-align:left;font-family:'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif}
table.t th{background:#f0f6fa;font-family:'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;font-weight:600;font-size:12.5px}
table.t tr.hit td{background:var(--accent-dim);font-weight:600}
.tabs{scrollbar-width:thin}
@media(max-width:620px){.tabs{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;margin-bottom:-1px;padding-bottom:1px}.tab{white-space:nowrap;flex:0 0 auto;padding:9px 12px;font-size:13px}}
.powered-by{display:flex;align-items:center;gap:7px;margin-top:18px;padding-top:12px;border-top:1px solid var(--rule);text-decoration:none;width:fit-content}
.powered-by:hover{opacity:.8}
.powered-by .pb-label{font-size:10.5px;color:var(--ink-dim)}
.powered-by .pb-logo{height:30px;width:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:500 12.5px 'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.good{background:#e3f7ea;border-color:var(--green-ink);color:var(--green-ink)}
.chip.wrong{background:#fdeee9;border-color:#c4513a;color:#c4513a}
.info{border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:8px;padding:9px 12px;background:#fbfdff;font-size:14px;margin:8px 0}
.info h3{font-size:15px;margin:0 0 4px;color:var(--accent-ink)}
.src{font-size:12px;color:var(--ink-dim);margin-top:6px}
.tblwrap{overflow-x:auto;max-width:100%}
.svgtxt{font-family:'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif}
.hot{cursor:pointer}
.drag{cursor:grab;touch-action:none}
.drag:active{cursor:grabbing}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}


.cvs{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:10px;background:#fbfdff}
.seis{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:8px;background:#fffdf5;margin-top:6px}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;margin:6px 0;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.wmap{background:#cfe6f5;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.zbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:500 13.5px 'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:7px 10px;border-radius:8px;margin:4px 0;cursor:pointer}
.zbtn i{flex:0 0 14px;height:14px;border-radius:3px}
.zbtn.on{border-color:var(--ink);font-weight:600}
.plab{font-size:9px;font-weight:700;fill:#24425e;paint-order:stroke;stroke:#e9f3fa;stroke-width:2.5px;stroke-linejoin:round;letter-spacing:.02em}
.vlab{font-size:9px;font-weight:600;fill:#16222e;paint-order:stroke;stroke:#fff;stroke-width:2.5px;stroke-linejoin:round}
.pin{cursor:pointer}
.lst{margin:6px 0;padding-left:20px;font-size:14px}.lst li{margin:3px 0}
.vlist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.vcard{border:1px solid var(--rule);border-left:4px solid #c4513a;border-radius:8px;padding:9px 12px;background:#fbfdff;font-size:14px;min-height:70px}
.vcard h3{font-size:15px;margin:0 0 4px;color:#a8432f}
.hzgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.hzc{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:#fbfdff;font-size:14px;font-weight:600}
.hzc .bt{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.hzc .bt button{font:500 12.5px 'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;border:1px solid var(--rule);background:#fff;padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left}
.hzc.good{background:#e3f7ea;border-color:var(--green-ink)}.hzc.bad{background:#fdeee9;border-color:#c4513a}
.qcard{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:10px 0;background:#fbfdff}
.qcard .qq{font-weight:600;margin-bottom:6px;font-size:14px}
.opt{display:block;width:100%;text-align:left;font:500 14px 'Inter','Noto Sans Sinhala','Noto Sans Tamil',sans-serif;border:1px solid var(--rule);background:#fff;color:var(--ink);padding:7px 10px;border-radius:8px;margin:4px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:#e3f7ea;border-color:var(--green-ink);color:var(--green-ink);font-weight:600}
.opt.wrongo{background:#fdeee9;border-color:#c4513a;color:#c4513a}
.qscore{font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--ink-dim);margin:6px 0}
.sec-h{font-size:16px;margin:16px 0 6px}
.phase{font-size:14px;min-height:2.6em;margin:6px 0;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
<div class="langbar"><button class="langbtn active" data-lang="en">English</button><button class="langbtn" data-lang="si">සිංහල</button><button class="langbtn" data-lang="ta">தமிழ்</button></div>
<a class="back-link" href="https://altovian.net/altoexplorers.html" target="_self" rel="noopener" data-i18n="back_link">← Back to AltoExplorers</a>

<h1 data-i18n="h1"></h1>
<p class="sub" data-i18n="sub"></p>
<div class="tabs">
 <button class="tab active" data-tab="eq" data-i18n="tab_eq"></button>
 <button class="tab" data-tab="pz" data-i18n="tab_pz"></button>
 <button class="tab" data-tab="ts" data-i18n="tab_ts"></button>
 <button class="tab" data-tab="vo" data-i18n="tab_vo"></button>
 <button class="tab" data-tab="qz" data-i18n="tab_qz"></button>
</div>

<section class="panel" id="panel-eq">
 <canvas id="eqCv" class="cvs" width="640" height="330"></canvas><canvas id="seCv" class="seis" width="640" height="90"></canvas>
 <div class="grid2" style="margin-top:12px">
  <div>
   <div class="ctrl"><label><span data-i18n="eq_str"></span><span class="val" id="eqSv"></span></label><input type="range" id="eqS" min="1" max="10" step="1" value="6"></div>
   <div class="row"><button class="btn" id="eqGo" data-i18n="eq_push"></button><button class="btn ghost" id="eqReset" data-i18n="eq_reset"></button></div>
   <div class="phase" id="eqPh"></div>
   <div class="stats" id="eqStats"></div>
  </div>
  <div class="info" data-i18n="eq_def"></div>
 </div>
 <h3 class="sec-h" data-i18n="rt_h"></h3>
 <div class="tblwrap"><table class="t" id="rtT"></table></div>
 <div class="grid2" style="margin-top:10px">
  <div class="note" data-i18n="eq_note"></div>
  <div class="info"><h3 data-i18n="eq_imp_h"></h3><ul class="lst"><li data-i18n="e1"></li><li data-i18n="e2"></li><li data-i18n="e3"></li><li data-i18n="e4"></li></ul></div>
 </div>
 <p class="src" data-i18n="eq_src"></p>
</section>

<section class="panel" id="panel-pz" hidden>
 <div class="wmap"><svg id="pzMap" viewBox="0 28 720 270" role="img" aria-label="world map of plates and earthquake zones"></svg></div>
 <div class="grid2" style="margin-top:10px">
  <div><div class="lbl" style="font-weight:600;font-size:13.5px" data-i18n="pz_zones"></div><p class="src" data-i18n="pz_tip"></p><div id="pzZones"></div></div>
  <div><label class="chk"><input type="checkbox" id="pzPl" checked><span data-i18n="pz_plates"></span></label>
   <label class="chk"><input type="checkbox" id="pzVo"><span data-i18n="pz_volc"></span></label>
   <div class="note" data-i18n="pz_note"></div></div>
 </div>
 <p class="src" data-i18n="pz_src"></p>
</section>

<section class="panel" id="panel-ts" hidden>
 <canvas id="tsCv" class="cvs" width="640" height="300"></canvas>
 <div class="grid2" style="margin-top:10px">
  <div>
   <div class="ctrl"><div class="lbl" data-i18n="ts_cause"></div><select id="tsC"></select></div>
   <div class="row"><button class="btn" id="tsGo" data-i18n="ts_go"></button><button class="btn ghost" id="tsReset" data-i18n="ts_reset"></button></div>
   <div class="stats" id="tsStats"></div>
   <p class="src" data-i18n="ts_major"></p>
  </div>
  <div><div class="info" data-i18n="ts_def"></div><div class="note" data-i18n="ts_note"></div></div>
 </div>
 <div class="grid2">
  <div class="info"><h3 data-i18n="ts_areas_h"></h3><ul class="lst"><li data-i18n="ta1"></li><li data-i18n="ta2"></li><li data-i18n="ta3"></li></ul><p style="font-size:14px;margin:6px 0 0" data-i18n="ts_2004"></p></div>
  <div class="warn"><b data-i18n="ts_safe_h"></b><ul class="lst"><li data-i18n="sf1"></li><li data-i18n="sf2"></li><li data-i18n="sf3"></li><li data-i18n="sf4"></li></ul></div>
 </div>
 <p class="src" data-i18n="ts_src"></p>
</section>

<section class="panel" id="panel-vo" hidden>
 <canvas id="voCv" class="cvs" width="640" height="330"></canvas>
 <div class="grid2" style="margin-top:10px">
  <div>
   <div class="row"><button class="btn" id="voGo" data-i18n="vo_erupt"></button><button class="btn ghost" id="voReset" data-i18n="vo_reset"></button><label class="chk"><input type="checkbox" id="voLab" checked><span data-i18n="vo_lab"></span></label></div>
   <div class="phase" id="voPh"></div>
   <div class="info" data-i18n="vo_def"></div></div>
  <div>
   <div class="seg" id="voMode"><button class="on" data-m="1" data-i18n="vo_mode1"></button><button data-m="2" data-i18n="vo_mode2"></button></div>
   <div class="wmap" style="margin-top:8px"><svg id="voMap" viewBox="0 28 720 270" role="img" aria-label="world map of volcanoes"></svg></div>
   <div class="vlist" id="voList"></div>
   <div class="vcard" id="voCard"></div>
  </div>
 </div>
 <div class="note" data-i18n="vo_note"></div>
 <div class="warn" data-i18n="vo_flag"></div>
 <p class="src" data-i18n="vo_src"></p>
</section>

<section class="panel" id="panel-qz" hidden>
 <h3 class="sec-h" style="margin-top:0" data-i18n="hz_h"></h3>
 <div class="hzgrid" id="hzBox"></div>
 <div class="qscore" id="hzScore"></div>
 <h3 class="sec-h" data-i18n="qz_h"></h3>
 <div id="qzBox"></div>
 <div class="qscore" id="qzScore"></div>
 <button class="btn ghost" id="qzReset" data-i18n="btn_retry"></button>

const I18N={"en": {"title": "Earthquake, Tsunami & Volcano Lab — Grade 11 Geography", "h1": "<span>Earthquake</span>, Tsunami &amp; Volcano Lab", "sub": "Build up stress until rocks break, read the Richter scale, find the world's earthquake zones, send a tsunami towards the coast and make a volcano erupt. Grade 11 Geography, Chapter 6 (Natural hazards in the world).", "tab_eq": "Earthquakes", "tab_pz": "Plates and zones", "tab_ts": "Tsunami", "tab_vo": "Volcanoes", "tab_qz": "Check yourself", "model": "model values", "eq_str": "Energy the rocks can store before they break", "eq_mag": "magnitude ≈ {m}", "eq_push": "Push the plates", "eq_reset": "Start again", "st_stress": "Stored energy", "st_mag": "Richter scale value", "st_band": "Result", "ph_calm": "Calm — press “Push the plates”.", "ph_build": "The plates push against each other. Energy is stored in the rocks…", "ph_snap": "The stored energy is more than the rocks can hold — they break suddenly. Earthquake!", "ph_after": "Shock waves spread out from the origin. Press “Push the plates” to store energy again.", "c_plate": "tectonic plate", "c_fault": "plate boundary", "c_origin": "origin", "c_waves": "shock waves", "c_seis": "seismograph", "c_energy": "energy", "rt_h": "Table 6.1 — Magnitude of earthquakes and their impacts", "rt_c1": "Value of the Richter scale", "rt_c2": "Result", "r1": "People do not feel it, but it is recorded on the scale.", "r2": "Everybody feels it.", "r3": "Buildings may collapse.", "r4": "Serious destruction can be seen.", "r5": "Completely destructive.", "r0": "—", "eq_def": "<b>Earthquake:</b> tremors on the surface of the Earth caused by shock waves from the movement of rock masses in the crust, especially near the boundaries of tectonic plates. When they come suddenly and cause great destruction they are called earthquakes.", "eq_note": "<b>Why do earthquakes happen?</b> The crust is made of tectonic plates that drift in different directions. Where they press against each other, energy is stored in the rocks. When it is more than the rocks can hold, it is released suddenly — an earthquake. A seismometer measures it and a seismograph records it; Charles F. Richter made the scale in 1935.", "eq_imp_h": "Impacts of earthquakes", "e1": "Cracks and faults appear in the crust.", "e2": "Landslides and sinking of land in mountain regions.", "e3": "Earthquakes on the ocean bed cause tsunamis that destroy nearby coasts.", "e4": "Damage to life and property, natural drainage and infrastructure.", "eq_src": "Chapter 6, \"Earthquakes\", Table 6.1. The link between stored energy and magnitude in the animation is a model.", "pz_zones": "Major earthquake zones (Map 6.2)", "pz_plates": "Show the seven main plates", "pz_volc": "Show volcanoes (Map 6.3)", "pz_bounds": "Plate boundaries", "zA": "A — Around the Pacific Ocean (Pacific Ring of Fire)", "zB": "B — Mediterranean–Himalaya mountain zone", "zC": "C — Mid-Atlantic oceanic ridge", "zD": "D — African Rift Valley zone", "p_pa": "Pacific Plate", "p_na": "North American Plate", "p_sa": "South American Plate", "p_eu": "Eurasian Plate", "p_af": "African Plate", "p_ia": "Indo-Australian Plate", "p_an": "Antarctic Plate", "pz_note": "Earthquakes happen again and again along the plate boundaries. About <b>70% of active volcanoes</b> lie on the plate margins around the Pacific Ocean — the <b>Pacific Ring of Fire</b>. Sri Lanka lies inside the Indo-Australian Plate, away from its edges.", "pz_tip": "Click a zone to highlight it.", "sl_lbl": "Sri Lanka", "pz_src": "Chapter 6, Maps 6.1–6.3. Plate boundaries: P. Bird (2003), PB2002 (Open Data Commons Attribution). Coastlines: Natural Earth. Zones drawn for this lab to match Map 6.2.", "ts_cause": "What starts the tsunami?", "ts_go": "Start", "ts_reset": "Start again", "tc1": "A massive earthquake on the ocean bed", "tc2": "A volcanic eruption on the ocean bed", "tc3": "A landslide on the ocean bed", "tc4": "A meteorite falling into the sea", "tc5": "Ice sheets falling from a glacier into the sea", "tc6": "A powerful explosion made by people", "st_depth": "Depth of the sea under the wave", "st_speed": "Wave speed", "st_height": "Wave height", "kmh": "km/h", "c_deep": "deep ocean", "c_coast": "coast", "c_sea": "sea level", "c_bed": "ocean bed", "ts_def": "<b>Tsunami:</b> high, long and strong ocean waves, caused by tremors that start on the ocean bed, that approach the coast.", "ts_note": "<b>Watch the wave:</b> in the deep ocean it is fast and low, so ships may not notice it. As the sea gets shallower near land it slows down and grows taller, turning into a tsunami wave near the coast.", "ts_major": "Of these, the major cause of tsunami waves is earthquakes on the ocean bed.", "ts_areas_h": "Areas affected by tsunamis", "ta1": "The coastal areas around the Pacific Ocean", "ta2": "The east Indian coastline and the Indian Ocean", "ta3": "Coastal areas close to the Caribbean islands", "ts_2004": "<b>26 December 2004:</b> an earthquake on the plate boundary near Sumatra sent tsunami waves across the Indian Ocean. They reached Sri Lanka's eastern coast about two hours later and hit the Northern, Eastern and Western coasts. About 35 000 people died and 500 000 were displaced.", "ts_safe_h": "If a tsunami warning comes", "sf1": "Leave the coast and move to higher ground.", "sf2": "If there is no high ground, go to an upper floor of a reinforced concrete building.", "sf3": "Listen to the media and the tsunami warning system.", "sf4": "If you feel an earthquake at the coast, leave without waiting for a warning.", "ts_src": "Chapter 6, \"Tsunami\" and Figure 6.5; Chapter 7, \"Tsunami\". Wave speed uses √(g × depth) (for extra knowledge); wave height and the two-hour travel time are for extra knowledge, not from the textbook.", "vo_erupt": "Erupt!", "vo_reset": "Start again", "vo_lab": "Show labels", "c_chamber": "magma chamber", "c_magma": "magma", "c_vent": "crater / vent", "c_lava": "lava", "c_ash": "smoke, ash and gases", "c_layers": "layers of cooled lava", "vs0": "The volcano is quiet. Magma lies in the chamber deep inside the Earth.", "vs1": "Magma rises through cracks and weak areas at the plate margins.", "vs2": "Eruption! Smoke, ash, gases and pieces of lava are thrown into the atmosphere, and lava flows out of the crater.", "vs3": "The lava flows around the volcano and cools into solid layers.", "vs4": "The volcano becomes dormant — but it may become active again and cause a hazard.", "vo_def": "<b>Volcanic eruption:</b> magma from the Earth's interior escapes through cracks and weak areas in the plate margins. Magma that flows on the surface is called <b>lava</b>.", "vo_note": "Ash plumes can change the weather for a short time and stop air travel. Most volcanoes are on plate boundaries; 70% of active ones are in the Pacific Ring of Fire.", "vo_mode1": "Eruptions in the textbook table", "vo_mode2": "Find the country (Activity 1)", "vo_pick": "Click a volcano on the map or in the list.", "vo_year": "Year erupted", "vo_dest": "Destruction caused", "vo_ctry": "Country", "v_ves": "Vesuvius", "v_kra": "Krakatoa", "v_pel": "Mount Pelée", "v_pin": "Pinatubo", "v_eyj": "Eyjafjallajökull", "v_sth": "Mount St Helens", "v_par": "Parícutin", "v_gal": "Galápagos", "v_kil": "Kilimanjaro", "v_hek": "Hekla", "v_fuj": "Fuji (Fujiyama)", "v_may": "Mayon", "v_rua": "Ruapehu", "k_it": "Italy", "k_id": "Indonesia", "k_mq": "Martinique (Caribbean)", "k_ph": "Philippines", "k_is": "Iceland", "k_us": "United States of America", "k_mx": "Mexico", "k_ec": "Ecuador", "k_tz": "Tanzania", "k_jp": "Japan", "k_nz": "New Zealand", "ev_ves79": "The whole city of Pompeii was destroyed and 16 000 lives were lost.", "ev_ves1631": "The eruption lasted two days. People of 15 cities around it were affected.", "ev_kra": "A huge eruption threw out so much ash and smoke that the sky was dark for days. Its tremors caused a tsunami; about 36 000 people were killed.", "ev_pel": "Killed 30 000 people.", "ev_pin": "Ash caused environmental   if(EQ.ph==='build'){EQ.stress+=dt/(1.2+0.35*+$('eqS').value);if(EQ.stress>=1){EQ.stress=0;EQ.ph='snap';EQ.M=eqMag();EQ.off+=5;EQ.shake=1;EQ.waves.push(0);EQ.dmg=bandOf(EQ.M);EQ.snapT=EQ.t;eqUi();}}

  EQ.shake=Math.max(0,EQ.shake-dt*.45);EQ.waves=EQ.waves.map(r=>r+dt*150).filter(r=>r<520);
  const amp=EQ.M?(2+(EQ.M-2)*5.2)*Math.pow(EQ.shake,1.5):0;

function baseMap(svg){S('rect',{x:0,y:0,width:720,height:360,fill:'#cfe6f5'},svg);
  const gr=S('g',{stroke:'#b9d6ea','stroke-width':.4},svg);for(let lo=-150;lo<=180;lo+=30)S('line',{x1:prj(lo,0)[0],y1:0,x2:prj(lo,0)[0],y2:360},gr);for(let la=-60;la<=75;la+=15)S('line',{x1:0,y1:prj(0,la)[1],x2:720,y2:prj(0,la)[1]},gr);
  S('path',{d:WORLD.land,fill:'#efe7d2',stroke:'#b8a98a','stroke-width':.4},svg);}
const PZ={sel:null};const pzSvg=$('pzMap');baseMap(pzSvg);
const pzZ=S('g',{},pzSvg),pzB=S('g',{},pzSvg),pzV=S('g',{},pzSvg),pzP=S('g',{},pzSvg),pzSL=S('g',{},pzSvg);
WORLD.plates.forEach(l=>{if(l.z)S('path',{d:l.d,fill:'none',stroke:ZCOL[l.z],'stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round','stroke-opacity':.35,'data-z':l.z},pzZ);S('path',{d:l.d,fill:'none',stroke:'#7a2a14','stroke-width':.9,'stroke-opacity':.8},pzB);});
const PLATES=[['p_pa',-150,-5],['p_na',-102,50],['p_sa',-58,-20],['p_eu',75,58],['p_af',18,3],['p_ia',112,-32],['p_an',30,-56]];
const VOLC={ves:[40.82,14.43,'k_it'],kra:[-6.10,105.42,'k_id'],pel:[14.81,-61.17,'k_mq'],pin:[15.14,120.35,'k_ph'],eyj:[63.63,-19.62,'k_is'],sth:[46.19,-122.19,'k_us'],par:[19.49,-102.25,'k_mx'],gal:[-0.83,-91.13,'k_ec'],kil:[-3.07,37.35,'k_tz'],hek:[63.98,-19.70,'k_is'],fuj:[35.36,138.73,'k_jp'],may:[13.26,123.69,'k_ph'],rua:[-39.28,175.57,'k_nz']};
function triPin(g,lat,lon,col,r){const p=prj(lon,lat);return S('path',{d:`M${p[0]},${p[1]-r} L${p[0]+r*.9},${p[1]+r*.6} L${p[0]-r*.9},${p[1]+r*.6} Z`,fill:col,stroke:'#fff','stroke-width':.8},g);}
function pzRender(){pzP.innerHTML='';pzV.innerHTML='';pzSL.innerHTML='';
  pzZ.querySelectorAll('path').forEach(p=>{const z=p.getAttribute('data-z');p.setAttribute('stroke-opacity',PZ.sel?(z===PZ.sel?.6:.08):.35);});
  if($('pzPl').checked)PLATES.forEach(p=>{const q=prj(p[1],p[2]);T(t(p[0]),{x:q[0],y:q[1],'text-anchor':'middle','class':'svgtxt plab'},pzP);});
  if($('pzVo').checked)Object.keys(VOLC).forEach(k=>triPin(pzV,VOLC[k][0],VOLC[k][1],'#c4513a',4.5));
  const sl=prj(80.7,7.9);S('circle',{cx:sl[0],cy:sl[1],r:2.6,fill:'#16222e',stroke:'#fff','stroke-width':.8},pzSL);T(t('sl_lbl'),{x:sl[0]+4,y:sl[1]+9,'class':'svgtxt vlab'},pzSL);
  const box=$('pzZones');box.innerHTML='';['A','B','C','D'].forEach(z=>{const b=document.createElement('button');b.className='zbtn'+(PZ.sel===z?' on':'');b.innerHTML=`<i style="background:${ZCOL[z]}"></i><span>${t('z'+z)}</span>`;
    b.addEventListener('click',()=>{PZ.sel=PZ.sel===z?null:z;pzRender();});box.appendChild(b);});}
$('pzPl').addEventListener('change',pzRender);$('pzVo').addEventListener('change',pzRender);
/* ===================== TSUNAMI ===================== */
const TS={ph:'idle',t:0,x:0,run:0,hit:[0,0,0]};const SEA=80;
const TSX={tc1:90,tc2:90,tc3:330,tc4:150,tc5:24,tc6:150};
function depthAt(px){if(px<300)return 4000;if(px<470)return 4000+(150-4000)*(px-300)/170;if(px<560)return 150*(1-(px-470)/90);return 0;}
function bedY(px){if(px<560)return SEA+depthAt(px)*.045;return SEA-(px-560)*.22;}
function tsH(d){return Math.pow(4000/Math.max(d,5),.25);}
function tsStep(dt){if(TS.ph==='idle'||TS.ph==='done')return;TS.t+=dt;
  if(TS.ph==='trig'&&TS.t>1){TS.ph='travel';TS.x=TSX[$('tsC').value];}
  if(TS.ph==='travel'){const d=depthAt(TS.x);const v=Math.max(16,Math.sqrt(9.81*d)*.6);TS.x+=v*dt;if(TS.x>=556){TS.ph='run';TS.run=0;}}
  if(TS.ph==='run'){TS.run=Math.min(1,TS.run+dt*.6);[0,1,2].forEach(i=>{if(560+tsH(2)*16*TS.run>578+i*24)TS.hit[i]=Math.min(1,TS.hit[i]+dt*2);});if(TS.run>=1&&TS.t>0){TS.ph='done';}}
  tsUi();}
function tsDraw(){const x=fitCanvas($('tsCv'),640,300);const c=$('tsC').value;
  let g=x.createLinearGradient(0,0,0,SEA);g.addColorStop(0,'#dbeefa');g.addColorStop(1,'#f4f9fc');x.fillStyle=g;x.fillRect(0,0,640,SEA);
  // water surface with wave
  const wave=px=>{if(TS.ph!=='travel'&&TS.ph!=='run')return 0;const d=depthAt(Math.min(TS.x,555));const H=TS.ph==='run'?tsH(2)*(1-TS.run*.6):tsH(d);const w=18+50*Math.sqrt(d/4000);const xc=TS.ph==='run'?556:TS.x;return (3+H*7)*Math.exp(-Math.pow(px-xc,2)/(2*w*w));};
  x.fillStyle='#3d8fc9';x.beginPath();x.moveTo(0,SEA-wave(0));for(let px=0;px<=560;px+=3)x.lineTo(px,SEA-wave(px));x.lineTo(560,bedY(560));for(let px=560;px>=0;px-=4)x.lineTo(px,bedY(px));x.closePath();x.fill();
  const gw=x.createLinearGradient(0,SEA,0,260);gw.addColorStop(0,'rgba(255,255,255,.12)');gw.addColorStop(1,'rgba(0,30,70,.35)');x.fillStyle=gw;x.fill();
  // bed and land
  x.fillStyle='#a8865d';x.beginPath();x.moveTo(0,300);for(let px=0;px<=640;px+=4)x.lineTo(px,bedY(px));x.lineTo(640,300);x.closePath();x.fill();x.fillStyle='#7fae6a';x.beginPath();x.moveTo(560,SEA);x.lineTo(640,SEA-17.6);x.lineTo(640,SEA-12);x.lineTo(560,SEA+5);x.closePath();x.fill();
  // run-up water on land
  if(TS.ph==='run'||TS.ph==='done'){const L=tsH(2)*16*(TS.ph==='done'?1:TS.run);x.fillStyle='rgba(61,143,201,.75)';x.beginPath();x.moveTo(556,SEA);x.lineTo(560+L,bedY(560+L)-2);x.lineTo(560+L,bedY(560+L)+2);x.lineTo(556,SEA+6);x.closePath();x.fill();}
  // houses on coast
  [0,1,2].forEach(i=>{const hx=578+i*24,hy=bedY(hx);x.save();x.translate(hx,hy);x.rotate(TS.hit[i]*1.1);x.fillStyle='#f1dcc8';x.strokeStyle='#5a4a3a';x.lineWidth=1;x.fillRect(-7,-12,14,12);x.strokeRect(-7,-12,14,12);x.fillStyle='#b5462f';x.beginPath();x.moveTo(-9,-12);x.lineTo(0,-19);x.lineTo(9,-12);x.closePath();x.fill();x.restore();});
  // trigger graphics
  const tp=TS.ph==='trig'?TS.t:(TS.ph==='idle'?0:1);const X0=TSX[c];
  if(c==='tc1'){const by=bedY(X0);const j=TS.ph==='idle'?0:Math.min(1,tp*3)*8;x.fillStyle='#8c6c48';x.fillRect(X0-30,by-j,30,8+j);x.fillStyle='#e4572e';x.beginPath();x.arc(X0-15,by+4,5,0,7);x.fill();}
  if(c==='tc2'){const by=bedY(X0);x.fillStyle='#6d5a48';x.beginPath();x.moveTo(X0-40,by);x.lineTo(X0-6,by-46);x.lineTo(X0+6,by-46);x.lineTo(X0+40,by);x.closePath();x.fill();if(TS.ph!=='idle'){x.fillStyle=`rgba(255,120,40,${1-tp*.5})`;x.beginPath();x.arc(X0,by-50,8+tp*14,0,7);x.fill();}}
  if(c==='tc3'){const by=bedY(X0);const s=TS.ph==='idle'?0:Math.min(1,tp)*30;x.fillStyle='#8c6c48';x.beginPath();x.moveTo(X0-20+s,by-6+s*.5);x.lineTo(X0+20+s,by+6+s*.5);x.lineTo(X0+s,by+12+s*.5);x.closePath();x.fill();}
  if(c==='tc4'){const fy=TS.ph==='idle'?20:Math.min(SEA,20+tp*120);x.fillStyle='#5a4a3a';x.beginPath();x.arc(X0+40-(fy-20)*.5,fy,7,0,7);x.fill();if(TS.ph==='idle'||tp<.5){x.strokeStyle='rgba(228,87,46,.6)';x.lineWidth=4;x.beginPath();x.moveTo(X0+40-(fy-20)*.5+6,fy-6);x.lineTo(X0+60-(fy-20)*.5,fy-22);x.stroke();}}
  if(c==='tc5'){x.fillStyle='#eef6fb';x.strokeStyle='#9cc3dd';x.beginPath();x.moveTo(0,SEA-40);x.lineTo(30,SEA-34);x.lineTo(34,SEA+20);x.lineTo(0,SEA+20);x.closePath();x.fill();x.stroke();const fy=TS.ph==='idle'?SEA-36:Math.min(SEA-4,SEA-36+tp*50);x.fillStyle='#e3f1fa';x.fillRect(32,fy,14,14);x.strokeRect(32,fy,14,14);}
  if(c==='tc6'&&TS.ph!=='idle'&&tp<1){x.fillStyle=`rgba(255,180,40,${1-tp})`;x.beginPath();x.arc(X0,SEA,6+tp*30,0,7);x.fill();}
  lbl(x,t('c_sea'),8,SEA-6,'#1f5f8b','left',11);lbl(x,t('c_deep'),150,180,'#ffffff','left',12);x.fillStyle='#fff';lbl(x,t('c_bed'),150,275,'#5a3a1a','left',11);lbl(x,t('c_coast'),632,SEA-26,'#2d5a1e','right',11);
  // scale hint
  x.fillStyle='rgba(255,255,255,.6)';}
function tsUi(){const d=TS.ph==='travel'?depthAt(TS.x):TS.ph==='run'||TS.ph==='done'?2:null;
  $('tsStats').innerHTML=[['st_depth',d===null?'—':Math.round(d)+' m'],['st_speed',d===null?'—':Math.round(Math.sqrt(9.81*Math.max(d,2))*3.6)+' '+t('kmh')],['st_height',d===null?'—':fmt(tsH(d),1)+' m']].map(s=>`<div class="stat"><div class="k">${t(s[0])}</div><div class="v">${s[1]}</div></div>`).join('')+`<div class="stat"><div class="k">&nbsp;</div><div class="v" style="font-size:12px">${t('model')}</div></div>`;}
function tsOpts(){const s=$('tsC'),v=s.value||'tc1';s.innerHTML='';['tc1','tc2','tc3','tc4','tc5','tc6'].forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=t(k);if(k===v)o.selected=true;s.appendChild(o);});}
$('tsGo').addEventListener('click',()=>{TS.ph='trig';TS.t=0;TS.run=0;TS.hit=[0,0,0];});
$('tsReset').addEventListener('click',()=>{TS.ph='idle';TS.t=0;TS.hit=[0,0,0];tsUi();});$('tsC').addEventListener('change',()=>{TS.ph='idle';TS.hit=[0,0,0];tsUi();});
/* ===================== VOLCANO ===================== */
const VO={ph:0,t:0,layers:3,parts:[],flow:0,cool:0};const VG=250,VPX=320,VTOP=96;
function coneX(y,side){return VPX+side*(20+(y-VTOP)*(150-20)/(VG-VTOP));}
function voStep(dt){if(VO.ph===0||VO.ph===4)return;VO.t+=dt;
  if(VO.ph===1&&VO.t>1.3){VO.ph=2;VO.t=0;}
  if(VO.ph===2){for(let k=0;k<4;k++)VO.parts.push({x:VPX+(Math.random()-.5)*20,y:VTOP,vx:(Math.random()-.3)*30,vy:-60-Math.random()*60,r:4+Math.random()*4,a:1,k:Math.random()<.15?'bomb':'ash'});
    VO.flow=Math.min(1,VO.flow+dt*.3);if(VO.t>3.8){VO.ph=3;VO.t=0;}}
  if(VO.ph===3){VO.cool=Math.min(1,VO.cool+dt*.45);if(VO.t>2.6){VO.ph=4;VO.layers=Math.min(8,VO.layers+1);VO.flow=0;VO.cool=0;}}
  VO.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='bomb'){p.vy+=140*dt;}else{p.vy*=.985;p.vx+=8*dt;p.r+=dt*7;p.a-=dt*.16;}});
  VO.parts=VO.parts.filter(p=>p.a>0&&p.y<VG&&p.y>-60&&p.x<700);if(VO.parts.length>500)VO.parts.splice(0,VO.parts.length-500);voUi();}
function voDraw(){const x=fitCanvas($('voCv'),640,330);const lab=$('voLab').checked;
  let g=x.createLinearGradient(0,0,0,VG);g.addColorStop(0,'#cfe6f5');g.addColorStop(1,'#f4f9fc');x.fillStyle=g;x.fillRect(0,0,640,VG);
  x.fillStyle='#9b7653';x.fillRect(0,VG,640,80);x.fillStyle='#7fae6a';x.fillRect(0,VG-5,170,5);x.fillRect(470,VG-5,170,5);
  // cone with layers
  x.fillStyle='#7d6a5a';x.beginPath();x.moveTo(170,VG);x.lineTo(VPX-20,VTOP);x.lineTo(VPX-8,VTOP+8);x.lineTo(VPX+8,VTOP+8);x.lineTo(VPX+20,VTOP);x.lineTo(470,VG);x.closePath();x.fill();
  for(let k=1;k<=VO.layers;k++){const off=k*7;x.strokeStyle=`rgba(60,45,35,${.25+.05*k})`;x.lineWidth=1.6;x.beginPath();x.moveTo(170+off*1.6,VG);x.lineTo(VPX-22+off*.15,VTOP+off);x.moveTo(VPX+22-off*.15,VTOP+off);x.lineTo(470-off*1.6,VG);x.stroke();}
  // chamber and vent
  const hot=VO.ph===1?Math.min(1,VO.t/1.3):VO.ph===2?1:VO.ph===3?1-VO.cool:0;
  x.fillStyle='#e8752a';x.beginPath();x.ellipse(VPX,316,96,22,0,0,7);x.fill();x.fillStyle='#5a3a2a';x.fillRect(VPX-6,VTOP+6,12,316-VTOP-20);
  if(hot>0){x.fillStyle='#ff8a1e';const top=VO.ph===1?296-(296-VTOP-6)*hot:VTOP+6;x.fillRect(VPX-5,top,10,296-top);}
  // lava flows
  if(VO.flow>0||VO.ph===3){const c=VO.cool;const col=`rgb(${Math.round(255-(255-80)*c)},${Math.round(120-(120-70)*c)},${Math.round(30+30*c)})`;x.strokeStyle=col;x.lineWidth=7;x.lineCap='round';
    [-1,1].forEach(sd=>{x.beginPath();x.moveTo(VPX+sd*16,VTOP+4);const yb=VTOP+(VG-VTOP)*VO.flow*(VO.ph===3?1:1);for(let y=VTOP+4;y<=VTOP+4+(VG-VTOP-6)*(VO.ph===3?1:VO.flow);y+=6)x.lineTo(coneX(y,sd)-sd*6,y);x.stroke();});x.lineCap='butt';}
  // particles
  VO.parts.forEach(p=>{if(p.k==='bomb'){x.fillStyle='#ff6a1a';x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill();}else{x.fillStyle=`rgba(90,90,95,${Math.max(0,p.a*.55)})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();}});
  if(lab){lbl(x,t('c_chamber'),VPX+104,318,'#7a2a14','left',11);lbl(x,t('c_magma'),VPX+12,224,'#a8331a','left',11);lbl(x,t('c_vent'),VPX+26,VTOP-6,'#16222e','left',11);
    lbl(x,t('c_layers'),150,VG-38,'#3d2c20','right',11);if(VO.flow>0||VO.ph===3)lbl(x,t('c_lava'),coneX(190,1)+6,190,'#a8331a','left',11);if(VO.ph>=2&&VO.ph<4)lbl(x,t('c_ash'),VPX-40,40,'#3b4752','left',11);}}
function voUi(){$('voPh').textContent=t('vs'+VO.ph);}
$('voGo').addEventListener('click',()=>{if(VO.ph===1||VO.ph===2||VO.ph===3)return;VO.ph=1;VO.t=0;voUi();});
$('voReset').addEventListener('click',()=>{Object.assign(VO,{ph:0,t:0,layers:3,parts:[],flow:0,cool:0});voUi();});$('voLab').addEventListener('change',voDraw);
// volcano map
const voSvg=$('voMap');baseMap(voSvg);const voB=S('g',{},voSvg);WORLD.plates.forEach(l=>S('path',{d:l.d,fill:'none',stroke:'#7a2a14','stroke-width':.6,'stroke-opacity':.5},voB));const voP=S('g',{},voSvg);
const EVENTS=[['ves79','ves',79],['ves1631','ves',1631],['kra','kra',1883],['pel','pel',1902],['pin','pin',1991],['eyj','eyj',2010]];
const FIND=['sth','par','gal','kil','hek','ves','fuj','pin','may','kra','rua'];
const VM={mode:1,sel:'ves79'};
function voMap(){voP.innerHTML='';const keys=VM.mode===1?[...new Set(EVENTS.map(e=>e[1]))]:FIND;const selV=VM.mode===1?(EVENTS.find(e=>e[0]===VM.sel)||[])[1]:VM.sel;
  keys.forEach(k=>{const v=VOLC[k];const on=k===selV;const pin=triPin(voP,v[0],v[1],on?'#e4572e':'#8a3a26',on?9:6.5);pin.setAttribute('class','pin');
    pin.addEventListener('click',()=>{VM.sel=VM.mode===1?EVENTS.find(e=>e[1]===k)[0]:k;voMap();});
    if(on){const p=prj(v[1],v[0]);T(t('v_'+k),{x:p[0]+(p[0]>600?-10:10),y:p[1]+4,'text-anchor':p[0]>600?'end':'start','class':'svgtxt vlab','font-size':12},voP);}});
  const list=$('voList');list.innerHTML='';
  (VM.mode===1?EVENTS.map(e=>[e[0],t('v_'+e[1])+' '+e[2]]):FIND.map(k=>[k,t('v_'+k)])).forEach(it=>{const b=document.createElement('button');b.className='chip'+(it[0]===VM.sel?' on':'');b.textContent=it[1];b.addEventListener('click',()=>{VM.sel=it[0];voMap();});list.appendChild(b);});
  const card=$('voCard');
  if(VM.mode===1){const e=EVENTS.find(q=>q[0]===VM.sel);card.innerHTML=`<h3>${t('v_'+e[1])} (${t(VOLC[e[1]][2])})</h3><div><b>${t('vo_year')}:</b> ${e[2]}</div><div><b>${t('vo_dest')}:</b> ${t('ev_'+e[0])}</div>`;}
  else{const v=VOLC[VM.sel];card.innerHTML=`<h3>${t('v_'+VM.sel)}</h3><div><b>${t('vo_ctry')}:</b> ${t(v[2])}</div>`;}}
$('voMode').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{VM.mode=+b.dataset.m;VM.sel=VM.mode===1?'ves79':'sth';$('voMode').querySelectorAll('button').forEach(q=>q.classList.toggle('on',q===b));voMap();}));
/* ===================== CHECK YOURSELF ===================== */
const HZ={hz1:'n',hz2:'n',hz3:'n',hz4:'n',hz5:'n',hz6:'h',hz7:'h',hz8:'h',hz9:'h',hz10:'h'};const HZORD=['hz6','hz1','hz9','hz3','hz7','hz4','hz2','hz8','hz5','hz10'];let HZS={};
function hzRender(){const box=$('hzBox');box.innerHTML='';HZORD.forEach(k=>{const c=document.createElement('div');c.className='hzc'+(HZS[k]?(HZS[k]===HZ[k]?' good':' bad'):'');c.innerHTML=`<div>${t(k)}</div>`;
  const bt=document.createElement('div');bt.className='bt';[['n','hz_nat'],['h','hz_hum']].forEach(o=>{const b=document.createElement('button');b.textContent=t(o[1]);if(HZS[k]===o[0])b.style.fontWeight='700';b.addEventListener('click',()=>{HZS[k]=o[0];hzRender();});bt.appendChild(b);});c.appendChild(bt);box.appendChild(c);});
  const s=Object.keys(HZS).filter(k=>HZS[k]===HZ[k]).length;$('hzScore').textContent=tf('hz_score',{s,n:HZORD.length});}
const QN=6;let QSEL={};
function renderQuiz(){const box=$('qzBox');box.innerHTML='';for(let q=1;q<=QN;q++){const k='q'+q,ans=+I18N.en[k+'a'];const card=document.createElement('div');card.className='qcard';
  const qq=document.createElement('div');qq.className='qq';qq.textContent=q+'. '+t(k);card.appendChild(qq);
  t(k+'o').split('|').forEach((o,oi)=>{const b=document.createElement('button');b.className='opt';b.textContent=o;
    if(QSEL[k]!==undefined){b.disabled=true;if(oi===ans)b.classList.add('right');else if(oi===QSEL[k])b.classList.add('wrongo');}
    b.addEventListener('click',()=>{QSEL[k]=oi;renderQuiz();});card.appendChild(b);});box.appendChild(card);}
  let s=0;for(let q=1;q<=QN;q++){if(QSEL['q'+q]===+I18N.en['q'+q+'a'])s++;}$('qzScore').textContent=tf('score',{s,n:QN});}
$('qzReset').addEventListener('click',()=>{QSEL={};HZS={};renderQuiz();hzRender();});
/* ===================== LOOP ===================== */
let CUR='eq',RAF=0,LAST=0;
function loop(ts){const dt=LAST?Math.min(.05,(ts-LAST)/1000):.016;LAST=ts;
  if(CUR==='eq'){eqStep(dt);eqDraw();}else if(CUR==='ts'){tsStep(dt);tsDraw();}else if(CUR==='vo'){voStep(dt);voDraw();}
  RAF=(CUR==='eq'||CUR==='ts'||CUR==='vo')?requestAnimationFrame(loop):0;}
function startLoop(){if(!RAF){LAST=0;RAF=requestAnimationFrame(loop);}}
setupTabs(tb=>{CUR=tb;if(tb==='pz')pzRender();if(tb==='vo')voMap();if(tb==='qz'){hzRender();renderQuiz();}startLoop();});
function onLang(){eqUi();pzRender();tsOpts();tsUi();voUi();voMap();hzRender();renderQuiz();}
window.addEventListener('resize',()=>{if(CUR==='eq')eqDraw();});
setTimeout(startLoop,0);

mergeI18n();
applyI18n();

</script>
