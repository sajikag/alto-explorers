<title>Star Cadet Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* ---- Committed single "space arcade" theme: explicit colors everywhere ---- */
  :root{
    --space-0:#070b22;
    --space-1:#0d1330;
    --space-2:#161d45;
    --space-3:#212a5e;
    --space-line:#33407e;
    --ink:#eef2ff;
    --ink-soft:#aab4e6;
    --gold:#ffce45;
    --gold-deep:#f5a623;
    --coral:#ff6b6b;
    --green:#57e389;
    --cyan:#4cc9f0;
    --purple:#b892ff;
    --shadow:rgba(3,6,20,.55);
    --font-display:"Fredoka", "Trebuchet MS", sans-serif;
    --font-body:"Nunito", "Segoe UI", sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);color:var(--ink);
    background:
      radial-gradient(1200px 700px at 78% -8%, rgba(184,146,255,.20), transparent 60%),
      radial-gradient(900px 600px at 12% 108%, rgba(76,201,240,.16), transparent 60%),
      var(--space-1);
    min-height:100vh;overflow-x:hidden;
  }
  #stars-bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:20px 18px 60px;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 18px;margin-bottom:22px;
    background:linear-gradient(180deg, var(--space-3), var(--space-2));
    border:1px solid var(--space-line);border-radius:20px;box-shadow:0 10px 30px var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand .badge{font-size:1.7rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));}
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.1rem,3.4vw,1.5rem);margin:0;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand small{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;}
  .top-right{display:flex;align-items:center;gap:10px;flex:none;}
  .sound-btn{cursor:pointer;font-size:1.2rem;line-height:1;width:44px;height:44px;border-radius:999px;background:var(--space-2);border:1px solid var(--space-line);transition:transform .1s, border-color .15s, background .15s;}
  .sound-btn:hover{border-color:var(--cyan);}
  .sound-btn:active{transform:scale(.92);}
  .sound-btn.off{opacity:.65;background:var(--space-1);}
  .star-counter{display:flex;align-items:center;gap:8px;flex:none;background:rgba(255,206,69,.12);border:1px solid rgba(255,206,69,.5);color:var(--gold);font-family:var(--font-display);font-weight:600;font-size:1.15rem;padding:8px 16px;border-radius:999px;}
  .star-counter .s{font-size:1.25rem;filter:drop-shadow(0 0 6px rgba(255,206,69,.6));}
  #starNum{font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:right;}

  /* ---------- hub ---------- */
  .hub-intro{text-align:center;margin:6px 0 20px;}
  .hub-intro h2{font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,5vw,2.3rem);margin:0 0 6px;text-wrap:balance;}
  .hub-intro p{color:var(--ink-soft);font-size:1.02rem;margin:0;font-weight:600;}

  .hub-controls{
    display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;
    background:linear-gradient(180deg, var(--space-2), var(--space-1));
    border:1px solid var(--space-line);border-radius:18px;padding:14px 16px;margin-bottom:18px;
  }
  .field{display:flex;align-items:center;gap:9px;}
  .field label{font-family:var(--font-display);font-weight:600;font-size:.95rem;color:var(--ink-soft);}
  .name-input{
    font-family:var(--font-body);font-weight:700;font-size:1rem;color:var(--ink);
    background:var(--space-1);border:2px solid var(--space-line);border-radius:12px;padding:9px 14px;width:150px;
  }
  .name-input:focus{outline:none;border-color:var(--cyan);}
  .name-input::placeholder{color:#6b78b8;}
  .level-btns{display:flex;gap:8px;}
  .level-btn{
    font-family:var(--font-display);font-weight:600;font-size:.95rem;cursor:pointer;
    background:var(--space-1);color:var(--ink-soft);border:2px solid var(--space-line);
    padding:8px 16px;border-radius:12px;transition:all .14s;
  }
  .level-btn:hover{border-color:var(--cyan);}
  .level-btn.active{color:#0b0f26;background:linear-gradient(180deg,var(--gold),var(--gold-deep));border-color:transparent;}
  .reset-btn{font-family:var(--font-display);font-weight:600;font-size:.88rem;cursor:pointer;background:transparent;color:var(--ink-soft);border:2px solid var(--space-line);padding:8px 14px;border-radius:12px;transition:all .14s;}
  .reset-btn:hover{border-color:var(--coral);color:var(--coral);}

  /* progress tracker */
  .progress{
    display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;
    margin:0 0 22px;
  }
  .progress .plabel{font-family:var(--font-display);font-weight:600;font-size:.82rem;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);}
  .mission-badge{
    font-size:1.5rem;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:var(--space-1);border:2px solid var(--space-line);position:relative;filter:grayscale(.85) opacity(.5);
    transition:all .3s;
  }
  .mission-badge.lit{filter:none;border-color:var(--gold);background:rgba(255,206,69,.14);box-shadow:0 0 14px rgba(255,206,69,.35);}
  .mission-badge.lit::after{content:"⭐";position:absolute;top:-8px;right:-8px;font-size:.9rem;}

  .pad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:720px){.pad-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.pad-grid{grid-template-columns:1fr;}}

  .pad{
    position:relative;cursor:pointer;text-align:left;border:1px solid var(--space-line);border-radius:22px;
    padding:20px 18px 40px;background:linear-gradient(180deg, var(--space-2), var(--space-1));
    box-shadow:0 8px 22px var(--shadow);transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    font-family:inherit;color:inherit;width:100%;overflow:hidden;
  }
  .pad:hover,.pad:focus-visible{transform:translateY(-4px);box-shadow:0 16px 34px var(--shadow);outline:none;}
  .pad:focus-visible{border-color:var(--cyan);}
  .pad .glow{position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;opacity:.5;filter:blur(14px);pointer-events:none;}
  .pad .icon{font-size:2.7rem;line-height:1;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
  .pad h3{font-family:var(--font-display);font-weight:600;font-size:1.25rem;margin:0 0 4px;}
  .pad p{margin:0 0 12px;color:var(--ink-soft);font-size:.9rem;font-weight:600;line-height:1.35;}
  .tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;font-size:.76rem;letter-spacing:.6px;padding:5px 12px;border-radius:999px;text-transform:uppercase;}
  .tag.math{background:rgba(255,107,107,.16);color:var(--coral);border:1px solid rgba(255,107,107,.45);}
  .tag.eng{background:rgba(87,227,137,.16);color:var(--green);border:1px solid rgba(87,227,137,.45);}
  .pad .go{position:absolute;right:16px;bottom:14px;font-family:var(--font-display);font-weight:600;color:var(--ink-soft);font-size:.88rem;}

  /* ---------- game screen ---------- */
  .screen{display:none;}
  .screen.active{display:block;animation:fadeUp .35s ease both;}
  .hub.hidden{display:none;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .game-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .back-btn{font-family:var(--font-display);font-weight:600;font-size:1rem;cursor:pointer;background:var(--space-3);color:var(--ink);border:1px solid var(--space-line);padding:10px 16px;border-radius:999px;transition:background .15s,transform .1s;}
  .back-btn:hover{background:var(--space-line);}
  .back-btn:active{transform:scale(.96);}
  .game-title{font-family:var(--font-display);font-weight:600;font-size:1.4rem;margin:0;}
  .level-pill{margin-left:auto;font-family:var(--font-display);font-weight:600;font-size:.8rem;color:var(--ink-soft);background:var(--space-2);border:1px solid var(--space-line);padding:6px 12px;border-radius:999px;}

  .panel{background:linear-gradient(180deg, var(--space-2), var(--space-1));border:1px solid var(--space-line);border-radius:24px;padding:26px 22px 30px;box-shadow:0 10px 30px var(--shadow);text-align:center;}
  .prompt{font-family:var(--font-display);font-weight:600;font-size:clamp(1.3rem,4.6vw,1.9rem);margin:0 0 6px;text-wrap:balance;}
  .subprompt{color:var(--ink-soft);font-weight:700;margin:0 0 20px;font-size:1rem;}

  .big-btn{font-family:var(--font-display);font-weight:600;font-size:1.15rem;cursor:pointer;border:none;border-radius:16px;padding:14px 28px;color:#0b0f26;background:linear-gradient(180deg, var(--gold), var(--gold-deep));box-shadow:0 6px 0 rgba(0,0,0,.28), 0 10px 20px rgba(0,0,0,.35);transition:transform .08s ease, filter .15s;}
  .big-btn:hover{filter:brightness(1.05);}
  .big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.28);}
  .big-btn.secondary{background:var(--space-3);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.28);}
  .btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
  .feedback{min-height:34px;font-family:var(--font-display);font-weight:600;font-size:1.35rem;margin-top:18px;transition:color .2s;}
  .feedback.good{color:var(--green);}
  .feedback.try{color:var(--gold);}

  /* ---- Rocket Hop ---- */
  .numline{position:relative;margin:34px auto 8px;max-width:680px;padding:0 6px;}
  .track{position:relative;height:8px;background:var(--space-line);border-radius:999px;margin-top:52px;}
  .ticks{display:flex;justify-content:space-between;position:relative;}
  .tick{flex:1;text-align:center;cursor:pointer;}
  .tick .dot{width:15px;height:15px;border-radius:50%;background:var(--space-3);border:2px solid var(--space-line);margin:0 auto;position:relative;top:-11px;transition:transform .1s;}
  .tick:hover .dot{transform:scale(1.35);border-color:var(--cyan);}
  .tick .lbl{font-family:var(--font-display);font-weight:600;color:var(--ink-soft);margin-top:2px;display:block;}
  .tick.small .lbl{font-size:.78rem;}
  .tick .lbl{font-size:1rem;}
  .tick.here .dot{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px var(--cyan);transform:scale(1.2);}
  .tick.here .lbl{color:var(--cyan);}
  .rocket{position:absolute;top:-4px;font-size:2.1rem;transition:left .28s cubic-bezier(.34,1.4,.5,1);transform:translateX(-50%);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
  .hop-controls{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:30px;}
  .step-btn{font-family:var(--font-display);font-weight:600;font-size:1.5rem;cursor:pointer;width:60px;height:60px;border-radius:18px;color:var(--ink);background:var(--space-3);border:1px solid var(--space-line);box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .08s;}
  .step-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28);}
  .step-btn:disabled{opacity:.4;cursor:not-allowed;}
  .pos-read{font-family:var(--font-display);font-weight:600;font-size:1.02rem;color:var(--ink-soft);min-width:120px;}
  .hint{font-size:.85rem;color:var(--ink-soft);font-weight:700;margin-top:14px;}

  /* ---- Star Catcher ---- */
  .ten-frame{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;max-width:420px;margin:24px auto 6px;}
  .cell{aspect-ratio:1/1;border-radius:14px;cursor:pointer;background:var(--space-1);border:2px dashed var(--space-line);display:flex;align-items:center;justify-content:center;font-size:1.7rem;transition:transform .1s, background .15s, border-color .15s;}
  .cell:hover{border-color:var(--gold);}
  .cell:active{transform:scale(.92);}
  .cell.filled{background:rgba(255,206,69,.14);border-style:solid;border-color:var(--gold);}
  .cell .st{opacity:0;transform:scale(.3);transition:transform .2s cubic-bezier(.34,1.6,.5,1),opacity .2s;}
  .cell.filled .st{opacity:1;transform:scale(1);}
  .count-read{font-family:var(--font-display);font-weight:600;font-size:1.2rem;margin-top:16px;}
  .count-read b{color:var(--gold);font-size:1.5rem;}

  /* ---- Word Lab ---- */
  .word-emoji{font-size:4.6rem;line-height:1;margin:6px 0 14px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));}
  .slots{display:flex;gap:12px;justify-content:center;margin:6px 0 8px;flex-wrap:wrap;}
  .slot{width:60px;height:70px;border-radius:16px;background:var(--space-1);border:2px solid var(--space-line);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:2.1rem;text-transform:uppercase;color:var(--ink);}
  .slot.done{border-color:var(--green);background:rgba(87,227,137,.12);}
  .tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px;}
  .tile{width:58px;height:58px;border-radius:14px;cursor:pointer;font-family:var(--font-display);font-weight:600;font-size:1.6rem;text-transform:uppercase;color:#0b0f26;background:linear-gradient(180deg,#dfe6ff,#b7c2f0);border:none;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .08s;}
  .tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .tile:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none;}

  /* ---- Rhyme Rocket & Sight-Word (option cards) ---- */
  .rhyme-target{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:rgba(184,146,255,.12);border:1px solid rgba(184,146,255,.5);border-radius:20px;padding:16px 30px;margin:6px 0 8px;}
  .rhyme-target .em{font-size:3.4rem;line-height:1;}
  .rhyme-target .wd{font-family:var(--font-display);font-weight:600;font-size:1.5rem;text-transform:lowercase;color:var(--purple);}
  .options{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:560px;margin:22px auto 0;}
  @media (max-width:480px){.options{grid-template-columns:repeat(2,1fr);}}
  .opt{cursor:pointer;border-radius:18px;padding:16px 8px;background:var(--space-3);border:2px solid var(--space-line);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s, border-color .15s, background .15s;}
  .opt:hover{border-color:var(--cyan);transform:translateY(-3px);}
  .opt .em{font-size:2.7rem;line-height:1;}
  .opt .wd{font-family:var(--font-display);font-weight:600;font-size:1.12rem;color:var(--ink);}
  .opt.correct{border-color:var(--green);background:rgba(87,227,137,.16);}
  .opt.wrong{border-color:var(--coral);background:rgba(255,107,107,.14);opacity:.6;}
  .opt:disabled{cursor:default;}

  /* ---- Sight-Word Hunt rocks ---- */
  .sight-target{display:inline-block;background:rgba(76,201,240,.14);border:2px solid rgba(76,201,240,.6);border-radius:16px;padding:12px 28px;margin:6px 0 6px;font-family:var(--font-display);font-weight:600;font-size:2rem;color:var(--cyan);}
  .word-rocks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:520px;margin:22px auto 0;}
  @media (max-width:480px){.word-rocks{grid-template-columns:repeat(2,1fr);}}
  .wrock{cursor:pointer;border-radius:18px;padding:20px 8px;background:var(--space-3);border:2px solid var(--space-line);font-family:var(--font-display);font-weight:600;font-size:1.4rem;color:var(--ink);transition:transform .1s, border-color .15s, background .15s;position:relative;}
  .wrock::before{content:"☄️";position:absolute;left:8px;top:6px;font-size:.9rem;opacity:.5;}
  .wrock:hover{border-color:var(--cyan);transform:translateY(-3px);}
  .wrock.correct{border-color:var(--green);background:rgba(87,227,137,.16);color:var(--green);}
  .wrock.wrong{border-color:var(--coral);background:rgba(255,107,107,.12);opacity:.55;}
  .wrock:disabled{cursor:default;}

  /* ---- Balance Scale ---- */
  .balance{position:relative;width:100%;max-width:520px;margin:20px auto 0;height:210px;}
  .pivot{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:62px solid var(--space-3);filter:drop-shadow(0 -2px 0 var(--space-line));}
  .base{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:150px;height:14px;border-radius:8px;background:var(--space-3);border:1px solid var(--space-line);}
  .beam-wrap{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);width:400px;max-width:88%;}
  .beam{position:relative;height:12px;border-radius:8px;background:linear-gradient(90deg,var(--cyan),var(--purple));transform-origin:center;transition:transform .5s cubic-bezier(.34,1.3,.5,1);box-shadow:0 3px 10px var(--shadow);}
  .beam.level{box-shadow:0 0 18px var(--green);}
  .pan{position:absolute;top:6px;width:104px;transform:translateX(-50%);}
  .pan.left{left:0;}
  .pan.right{left:100%;}
  .pan .dish{height:8px;border-radius:0 0 40px 40px;background:var(--space-3);border:1px solid var(--space-line);border-top:none;}
  .pan .rocks{display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:1px;min-height:44px;align-content:flex-end;padding-bottom:2px;}
  .pan .rocks span{font-size:1.15rem;line-height:1;}
  .pan .cap{font-family:var(--font-display);font-weight:600;font-size:1.1rem;color:var(--ink-soft);margin-top:4px;}
  .num-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:440px;margin:6px auto 0;}
  .num-btn{font-family:var(--font-display);font-weight:600;font-size:1.15rem;cursor:pointer;width:50px;height:50px;border-radius:13px;color:var(--ink);background:var(--space-3);border:1px solid var(--space-line);box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s, border-color .12s;}
  .num-btn:hover{border-color:var(--cyan);}
  .num-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28);}
  .num-btn.picked{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#0b0f26;border-color:transparent;}

  /* ---- Meteor Math (missing number) ---- */
  .equation{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0 6px;font-family:var(--font-display);font-weight:600;font-size:clamp(2rem,7vw,3rem);color:var(--ink);}
  .eq-blank{width:74px;height:74px;border-radius:16px;background:rgba(255,206,69,.12);border:3px dashed var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:2rem;color:var(--gold);}
  .eq-blank.filled{border-style:solid;background:rgba(87,227,137,.14);border-color:var(--green);color:var(--green);}
  .num-options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
  .num-opt{font-family:var(--font-display);font-weight:600;font-size:1.8rem;cursor:pointer;width:70px;height:70px;border-radius:16px;color:var(--ink);background:var(--space-3);border:2px solid var(--space-line);box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .08s, border-color .12s, background .15s;}
  .num-opt:hover{border-color:var(--cyan);}
  .num-opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28);}
  .num-opt.correct{background:rgba(87,227,137,.18);border-color:var(--green);color:var(--green);}
  .num-opt.wrong{background:rgba(255,107,107,.14);border-color:var(--coral);opacity:.55;}
  .num-opt:disabled{cursor:default;}

  /* ---- Space Compare ---- */
  .compare-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:22px 0 6px;flex-wrap:wrap;}
  .compare-card{cursor:pointer;min-width:130px;border-radius:20px;padding:20px 18px;background:var(--space-3);border:3px solid var(--space-line);transition:transform .1s, border-color .15s, background .15s;}
  .compare-card:hover{border-color:var(--cyan);transform:translateY(-4px);}
  .compare-card .big-num{font-family:var(--font-display);font-weight:700;font-size:3.2rem;line-height:1;color:var(--ink);}
  .compare-card .dots{margin-top:8px;font-size:.95rem;line-height:1.1;max-width:150px;word-break:break-word;}
  .compare-card.correct{border-color:var(--green);background:rgba(87,227,137,.16);}
  .compare-card.wrong{border-color:var(--coral);background:rgba(255,107,107,.12);opacity:.6;}
  .compare-card:disabled{cursor:default;}
  .vs{font-family:var(--font-display);font-weight:600;font-size:1.6rem;color:var(--ink-soft);}

  /* ---- Sentence Build ---- */
  .sent-hint{font-size:2.6rem;margin:6px 0 10px;}
  .sentence-line{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background:var(--space-1);border:2px solid var(--space-line);border-radius:16px;padding:12px;max-width:560px;margin:0 auto;}
  .sentence-line:empty::before{content:"Tap words below in order…";color:#6b78b8;font-family:var(--font-body);font-weight:700;font-size:.95rem;}
  .sent-slotword{font-family:var(--font-display);font-weight:600;font-size:1.3rem;color:var(--green);padding:4px 4px;}
  .word-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;}
  .word-tile{font-family:var(--font-display);font-weight:600;font-size:1.25rem;cursor:pointer;color:#0b0f26;background:linear-gradient(180deg,#dfe6ff,#b7c2f0);border:none;border-radius:12px;padding:12px 18px;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .08s;}
  .word-tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .word-tile:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none;}

  /* ---- Skip Trail ---- */
  .skip-seq{font-size:clamp(1.5rem,5.5vw,2.3rem);gap:10px;}
  .skip-seq .arrow{color:var(--ink-soft);font-size:1.1rem;opacity:.7;}

  /* ---- Missing Letter ---- */
  .ml-word{display:flex;gap:8px;justify-content:center;align-items:center;font-family:var(--font-display);font-weight:600;font-size:clamp(2rem,7vw,2.8rem);text-transform:lowercase;margin:6px 0 4px;}
  .ml-word .ml-letter{color:var(--ink);}
  .eq-blank.ml-blank{width:54px;height:64px;font-size:1.9rem;}
  .num-opt.letter-opt{text-transform:lowercase;}

  #confetti{position:fixed;inset:0;z-index:50;pointer-events:none;}
  .foot{text-align:center;color:var(--ink-soft);font-size:.82rem;margin-top:34px;font-weight:600;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
</style>

<script>
(function(){
  "use strict";

  /* ---------- persistence (per-viewer, survives reloads) ---------- */
  var SKEY='starCadetAcademy';
  var save = { name:'', level:'easy', stars:0, done:{}, sound:true };
  (function loadSave(){
    try{ var raw=localStorage.getItem(SKEY); if(raw){ var o=JSON.parse(raw); if(o&&typeof o==='object'){
      if(typeof o.name==='string') save.name=o.name;
      if(o.level==='easy'||o.level==='medium'||o.level==='hard') save.level=o.level;
      if(typeof o.stars==='number'&&o.stars>=0) save.stars=o.stars;
      if(o.done&&typeof o.done==='object') save.done=o.done;
      if(typeof o.sound==='boolean') save.sound=o.sound;
    } } }catch(e){}
  })();
  function persist(){ try{ localStorage.setItem(SKEY, JSON.stringify(save)); }catch(e){} }

  /* ---------- shared state ---------- */
  var stars = save.stars;
  var starNum = document.getElementById('starNum');
  starNum.textContent = stars;
  function addStars(n){
    stars += n; save.stars = stars; starNum.textContent = stars; persist();
    starNum.animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'});
  }

  var cadetName = save.name || "";
  var nameInput = document.getElementById('cadetName');
  var hubGreet = document.getElementById('hubGreet');
  if(cadetName) nameInput.value = cadetName;
  function refreshGreet(){
    hubGreet.textContent = cadetName ? ('Pick a mission, '+cadetName+'! 👩‍🚀') : 'Pick a mission, cadet! 👩‍🚀';
  }
  refreshGreet();
  nameInput.addEventListener('input', function(){
    cadetName = nameInput.value.trim().replace(/(^|\s)\S/g, function(c){return c.toUpperCase();});
    save.name = cadetName; persist(); refreshGreet();
  });

  /* ---------- difficulty ---------- */
  var LEVEL = save.level || 'easy';
  var CFG = {
    easy:  { hopMax:10, starMax:10, balMax:6,  words4:false, missMax:10, compMax:10, longSent:false, alwaysSub:false, skips:[2],     wordTier:0, pill:'🟢 Easy' },
    medium:{ hopMax:20, starMax:20, balMax:10, words4:true,  missMax:20, compMax:20, longSent:true,  alwaysSub:false, skips:[2,5],   wordTier:1, pill:'🟡 Medium' },
    hard:  { hopMax:20, starMax:20, balMax:12, words4:true,  missMax:20, compMax:50, longSent:true,  alwaysSub:true,  skips:[5,10],  wordTier:2, pill:'🔴 Hard' }
  };
  function cfg(){ return CFG[LEVEL]; }
  var levelPill = document.getElementById('levelPill');
  function reflectLevel(){
    document.querySelectorAll('.level-btn').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-lvl')===LEVEL); });
    levelPill.textContent = cfg().pill;
  }
  document.getElementById('levelBtns').addEventListener('click', function(e){
    var b = e.target.closest('.level-btn'); if(!b) return;
    LEVEL = b.getAttribute('data-lvl'); save.level = LEVEL; persist(); reflectLevel();
  });
  reflectLevel();

  /* ---------- progress tracker ---------- */
  var done = save.done || {};
  function litBadge(key, animate){
    var el=document.getElementById('pg-'+key); if(!el) return;
    el.classList.add('lit');
    if(animate) el.animate([{transform:'scale(1)'},{transform:'scale(1.4) rotate(8deg)'},{transform:'scale(1)'}],{duration:500,easing:'ease-out'});
  }
  Object.keys(done).forEach(function(k){ if(done[k]) litBadge(k,false); });
  function markDone(key){
    if(done[key]) return; done[key]=true; save.done=done; persist();
    litBadge(key,true);
  }
  document.getElementById('resetBtn').addEventListener('click', function(){
    for(var k in done){ if(Object.prototype.hasOwnProperty.call(done,k)) delete done[k]; }
    save = { name:'', level:'easy', stars:0, done:done, sound:true };
    try{ localStorage.removeItem(SKEY); }catch(e){}
    stars=0; starNum.textContent='0';
    cadetName=''; nameInput.value=''; refreshGreet();
    document.querySelectorAll('.mission-badge.lit').forEach(function(el){ el.classList.remove('lit'); });
    LEVEL='easy'; reflectLevel();
    soundOn=true; reflectSound(); sndBlip();
  });

  /* ---------- sound ---------- */
  var actx = null;
  var soundOn = save.sound !== false;
  function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  var soundBtn = document.getElementById('soundBtn');
  function reflectSound(){ soundBtn.textContent = soundOn ? '🔊' : '🔇'; soundBtn.classList.toggle('off', !soundOn); }
  reflectSound();
  soundBtn.addEventListener('click', function(){
    soundOn = !soundOn; save.sound = soundOn; persist(); reflectSound();
    if(soundOn){ ac(); sndPop(); }
  });
  function tone(freq, start, dur, type, vol){
    if(!soundOn) return;
    var c=ac(); if(!c) return;
    var o=c.createOscillator(), g=c.createGain(); o.type=type||'sine'; o.frequency.value=freq;
    var t=c.currentTime+start; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.18,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
  }
  function sndCorrect(){ [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f,i*0.09,0.28,'triangle',0.2); }); }
  function sndTry(){ tone(311.13,0,0.22,'sine',0.16); tone(233.08,0.12,0.26,'sine',0.16); }
  function sndBlip(){ tone(660,0,0.09,'square',0.08); }
  function sndPop(){ tone(880,0,0.12,'triangle',0.14); }

  /* ---------- confetti ---------- */
  var cfCanvas=document.getElementById('confetti'), cfCtx=cfCanvas.getContext('2d'), parts=[], cfRunning=false;
  function sizeCanvas(cv){ cv.width=innerWidth; cv.height=innerHeight; }
  function celebrate(){
    sizeCanvas(cfCanvas);
    var colors=['#ffce45','#57e389','#4cc9f0','#b892ff','#ff6b6b'];
    for(var i=0;i<70;i++){ parts.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight/2-40,vx:(Math.random()-.5)*10,vy:-Math.random()*11-4,g:.32+Math.random()*.15,r:5+Math.random()*7,c:colors[(Math.random()*colors.length)|0],rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,life:90+Math.random()*40,star:Math.random()<.5}); }
    if(!cfRunning){ cfRunning=true; requestAnimationFrame(cfLoop); }
  }
  function drawStar(x,y,r,rot,color){
    cfCtx.save(); cfCtx.translate(x,y); cfCtx.rotate(rot); cfCtx.beginPath();
    for(var i=0;i<5;i++){ cfCtx.lineTo(Math.cos((18+i*72)/180*Math.PI)*r,-Math.sin((18+i*72)/180*Math.PI)*r); cfCtx.lineTo(Math.cos((54+i*72)/180*Math.PI)*r*0.5,-Math.sin((54+i*72)/180*Math.PI)*r*0.5); }
    cfCtx.closePath(); cfCtx.fillStyle=color; cfCtx.fill(); cfCtx.restore();
  }
  function cfLoop(){
    cfCtx.clearRect(0,0,cfCanvas.width,cfCanvas.height);
    for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
      if(p.star){ drawStar(p.x,p.y,p.r,p.rot,p.c); } else { cfCtx.save(); cfCtx.translate(p.x,p.y); cfCtx.rotate(p.rot); cfCtx.fillStyle=p.c; cfCtx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); cfCtx.restore(); }
      if(p.life<=0||p.y>cfCanvas.height+40) parts.splice(i,1); }
    if(parts.length){ requestAnimationFrame(cfLoop); } else { cfRunning=false; cfCtx.clearRect(0,0,cfCanvas.width,cfCanvas.height); }
  }

  /* ---------- starfield ---------- */
  var bg=document.getElementById('stars-bg'), bgc=bg.getContext('2d'), bgStars=[];
  function initBg(){ sizeCanvas(bg); bgStars=[]; var n=Math.min(140,Math.floor(innerWidth*innerHeight/9000));
    for(var i=0;i<n;i++){ bgStars.push({x:Math.random()*bg.width,y:Math.random()*bg.height,r:Math.random()*1.6+.3,tw:Math.random()*6.28,sp:.02+Math.random()*.04}); } }
  function bgLoop(){ bgc.clearRect(0,0,bg.width,bg.height);
    for(var i=0;i<bgStars.length;i++){ var s=bgStars[i]; s.tw+=s.sp; var a=.4+Math.sin(s.tw)*.4; bgc.beginPath(); bgc.arc(s.x,s.y,s.r,0,6.28); bgc.fillStyle='rgba(220,230,255,'+a+')'; bgc.fill(); }
    requestAnimationFrame(bgLoop); }
  initBg(); requestAnimationFrame(bgLoop);
  addEventListener('resize', function(){ initBg(); });

  /* ---------- navigation ---------- */
  var hub=document.getElementById('hub'), screen=document.getElementById('screen');
  var gamePanel=document.getElementById('gamePanel'), gameTitle=document.getElementById('gameTitle');
  var games={};
  document.getElementById('padGrid').addEventListener('click', function(e){
    var pad=e.target.closest('.pad'); if(!pad) return; ac(); openGame(pad.getAttribute('data-game'));
  });
  document.getElementById('backBtn').addEventListener('click', function(){
    screen.classList.remove('active'); hub.classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'});
  });
  function openGame(key){
    var g=games[key]; if(!g) return;
    gameTitle.textContent=g.title; levelPill.textContent=cfg().pill;
    hub.classList.add('hidden'); screen.classList.add('active'); g.start(gamePanel); window.scrollTo({top:0});
  }

  function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=arr[i];arr[i]=arr[j];arr[j]=t; } return arr; }
  function winMsg(list){ var base=list[(Math.random()*list.length)|0]; return cadetName ? base.replace('!', ', '+cadetName+'!') : base; }
  function win(fbEl, msgs, key){ sndCorrect(); celebrate(); addStars(1); if(key) markDone(key); fbEl.textContent=winMsg(msgs); fbEl.className='feedback good'; }
  function nudge(fbEl, msg){ sndTry(); fbEl.textContent=msg; fbEl.className='feedback try'; }
  var WIN_MATH=['🎉 Blast off! Correct!','⭐ Star earned!','🚀 You did it!','🌟 Super work!'];
  var WIN_ENG =['🎉 Perfect!','⭐ Word master!','🌟 Brilliant!','🛸 You got it!'];

  function repeat(ch,n){ var s=''; for(var i=0;i<n;i++) s+=ch; return s; }

  /* ============ GAME 1: ROCKET HOP ============ */
  games.hop = { title:'🚀 Rocket Hop', start:function(root){
    var a,b,op,answer,pos,max;
    function newProblem(){
      max=cfg().hopMax; op=Math.random()<0.5?'+':'-';
      if(op==='+'){ a=rand(1,Math.max(1,Math.floor(max*0.7))); b=rand(1,max-a); answer=a+b; }
      else { a=rand(3,max); b=rand(1,a); answer=a-b; }
      pos=0; render();
    }
    function render(){
      var ticks='';
      var small = max>10 ? ' small' : '';
      for(var i=0;i<=max;i++){ ticks+='<div class="tick'+small+(i===pos?' here':'')+'" data-i="'+i+'"><div class="dot"></div><span class="lbl">'+i+'</span></div>'; }
      root.innerHTML=
        '<p class="prompt">'+a+' '+op+' '+b+' = ?</p>'+
        '<p class="subprompt">Tap a number to fly there — or use the arrows. Then Blast off!</p>'+
        '<div class="numline"><div class="ticks">'+ticks+'</div><div class="track"></div><div class="rocket" id="rk">🚀</div></div>'+
        '<div class="hop-controls"><button class="step-btn" id="minus">◀</button><span class="pos-read">Rocket on <b id="posv">'+pos+'</b></span><button class="step-btn" id="plus">▶</button></div>'+
        '<div class="btn-row"><button class="big-btn" id="check">🚀 Blast off!</button></div>'+
        '<div class="feedback" id="fb"></div>';
      placeRocket();
      root.querySelectorAll('.tick').forEach(function(t){ t.onclick=function(){ pos=+t.getAttribute('data-i'); sndBlip(); update(); }; });
      root.querySelector('#plus').onclick=function(){ if(pos<max){pos++; sndBlip(); update();} };
      root.querySelector('#minus').onclick=function(){ if(pos>0){pos--; sndBlip(); update();} };
      root.querySelector('#check').onclick=check;
    }
    function placeRocket(){ root.querySelector('#rk').style.left=(pos/max*100)+'%'; }
    function update(){
      root.querySelectorAll('.tick').forEach(function(t){ t.classList.toggle('here',+t.getAttribute('data-i')===pos); });
      root.querySelector('#posv').textContent=pos;
      root.querySelector('#minus').disabled=pos===0; root.querySelector('#plus').disabled=pos===max; placeRocket();
    }
    function check(){
      var fb=root.querySelector('#fb');
      if(pos===answer){ win(fb,WIN_MATH,'hop'); var c=root.querySelector('#check'); c.textContent='Next mission ▶'; c.onclick=newProblem; }
      else if(pos<answer){ nudge(fb,'A little more — fly right! ▶'); }
      else { nudge(fb,'Too far — come back! ◀'); }
    }
    newProblem();
  }};

  /* ============ GAME 2: STAR CATCHER ============ */
  games.star = { title:'🌟 Star Catcher', start:function(root){
    var target, filled, slots;
    function newRound(){ slots=cfg().starMax; target=rand(2,slots); filled=[]; for(var i=0;i<slots;i++) filled.push(false); render(); }
    function render(){
      var cells=''; for(var i=0;i<slots;i++){ cells+='<div class="cell'+(filled[i]?' filled':'')+'" data-i="'+i+'"><span class="st">⭐</span></div>'; }
      root.innerHTML=
        '<p class="prompt">Catch '+target+' stars! 🌟</p>'+

      if(+b.getAttribute('data-v')===answer){ b.classList.add('correct'); var bl=root.querySelector('#blank'); bl.textContent=answer; bl.classList.add('filled');
        root.querySelectorAll('.num-opt').forEach(function(x){x.disabled=true;});
        win(fb,WIN_MATH,'skip'); var p=document.createElement('div'); p.className='btn-row'; p.innerHTML='<button class="big-btn" id="nx">Next ▶</button>'; fb.after(p); document.getElementById('nx').onclick=newRound; }
      else { b.classList.add('wrong'); b.disabled=true; nudge(fb,'Count the jumps again! 🦘'); }
    }
    newRound();
  }};

  /* ============ GAME 12: MISSING LETTER ============ */
  games.letter = { title:'🔡 Missing Letter', start:function(root){
    var W=[
      {w:'cat',e:'🐱',t:0},{w:'dog',e:'🐶',t:0},{w:'sun',e:'☀️',t:0},{w:'bug',e:'🐛',t:0},{w:'hat',e:'🎩',t:0},{w:'pig',e:'🐷',t:0},{w:'cup',e:'🥤',t:0},{w:'fox',e:'🦊',t:0},{w:'bus',e:'🚌',t:0},{w:'bed',e:'🛏️',t:0},{w:'jet',e:'🛩️',t:0},
      {w:'star',e:'⭐',t:1},{w:'moon',e:'🌙',t:1},{w:'fish',e:'🐟',t:1},{w:'frog',e:'🐸',t:1},{w:'boat',e:'⛵',t:1},{w:'tree',e:'🌳',t:1},{w:'ship',e:'🚀',t:1},{w:'nest',e:'🪺',t:1},{w:'rain',e:'🌧️',t:1},
      {w:'plant',e:'🌱',t:2},{w:'train',e:'🚂',t:2},{w:'cloud',e:'☁️',t:2},{w:'snake',e:'🐍',t:2},{w:'clock',e:'🕐',t:2},{w:'bread',e:'🍞',t:2},{w:'crown',e:'👑',t:2},{w:'grass',e:'🌿',t:2}
    ];
    var VOWELS=['a','e','i','o','u'];
    var cur, blankPos, answer;
    function pool(){ var t=cfg().wordTier; return W.filter(function(x){ return x.t<=t; }); }
    function newRound(){
      var p=pool(); cur=p[(Math.random()*p.length)|0];
      var vpos=[]; for(var i=0;i<cur.w.length;i++){ if(VOWELS.indexOf(cur.w[i])>=0) vpos.push(i); }
      blankPos = vpos.length ? vpos[(Math.random()*vpos.length)|0] : (Math.random()*cur.w.length)|0;
      answer = cur.w[blankPos];
      render();
    }
    function makeOpts(ans){
      var isVowel = VOWELS.indexOf(ans)>=0, set=[ans];
      var src = isVowel ? VOWELS.slice() : 'bcdfghjklmnprstw'.split('');
      shuffle(src);
      for(var i=0;i<src.length && set.length<4;i++){ if(set.indexOf(src[i])<0) set.push(src[i]); }
      return shuffle(set);
    }
    function render(){
      var shown=cur.w.split('').map(function(ch,i){ return i===blankPos ? '<span class="eq-blank ml-blank" id="blank">_</span>' : '<span class="ml-letter">'+ch+'</span>'; }).join('');
      var opts=makeOpts(answer), ob='';
      opts.forEach(function(l){ ob+='<button class="num-opt letter-opt" data-l="'+l+'">'+l+'</button>'; });
      root.innerHTML=
        '<p class="prompt">Finish the word!</p>'+
        '<div class="word-emoji">'+cur.e+'</div>'+
        '<div class="ml-word">'+shown+'</div>'+
        '<div class="num-options">'+ob+'</div>'+
        '<div class="feedback" id="fb"></div>';
      root.querySelectorAll('.letter-opt').forEach(function(b){ b.onclick=function(){ pick(b); }; });
    }
    function pick(b){
      var fb=root.querySelector('#fb');
      if(b.getAttribute('data-l')===answer){ b.classList.add('correct'); var bl=root.querySelector('#blank'); bl.textContent=answer; bl.classList.add('filled');
        root.querySelectorAll('.letter-opt').forEach(function(x){x.disabled=true;});
        win(fb,WIN_ENG,'letter'); var p=document.createElement('div'); p.className='btn-row'; p.innerHTML='<button class="big-btn" id="nx">Next word ▶</button>'; fb.after(p); document.getElementById('nx').onclick=newRound; }
      else { b.classList.add('wrong'); b.disabled=true; nudge(fb,'Say the word slowly — which sound fits? 👂'); }
    }
    newRound();
  }};

})();
</script>
