<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Countries Trivia</title>
<style>
  :root {
    --bg1: #1e3c72;
    --bg2: #2a5298;
    --card: #ffffff;
    --accent: #ff6b6b;
    --accent2: #4ecdc4;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --text: #2d3436;
    --muted: #636e72;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  .wrap { width: 100%; max-width: 720px; }
  .title {
    text-align: center;
    color: #fff;
    margin-bottom: 18px;
  }
  .title h1 { font-size: 28px; margin: 0 0 4px; }
  .title p { margin: 0; opacity: 0.85; font-size: 14px; }
  .card {
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    padding: 28px;
  }
  /* ---- Start screen ---- */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 16px 0 20px;
  }
  .cat-btn {
    border: 2px solid #e6e9ef;
    background: #f8f9fc;
    border-radius: 12px;
    padding: 14px 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all .15s ease;
    text-align: left;
  }
  .cat-btn:hover { border-color: var(--accent2); background: #eefbfa; }
  .cat-btn.active { border-color: var(--accent); background: #fff0ef; }
  .cat-btn .emoji { font-size: 20px; }
  .row-label { font-weight: 700; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
  .len-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .len-btn {
    border: 2px solid #e6e9ef; background: #f8f9fc; border-radius: 10px;
    padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  .len-btn.active { border-color: var(--accent); background: #fff0ef; }
  .start-btn {
    width: 100%; margin-top: 22px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #ff9068);
    color: #fff; font-size: 17px; font-weight: 700; padding: 15px;
    cursor: pointer; box-shadow: 0 10px 20px rgba(255,107,107,0.35);
  }
  .start-btn:active { transform: translateY(1px); }

  /* ---- Quiz screen ---- */
  .quiz-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; gap: 10px; }
  .quiz-top-left { display: flex; align-items: center; gap: 10px; }
  .exit-btn {
    border: 1px solid #e6e9ef; background: #f8f9fc; color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .exit-btn:hover { border-color: var(--wrong); color: var(--wrong); background: #fff5f5; }
  .progress-bar { height: 8px; background: #eef0f5; border-radius: 6px; overflow: hidden; margin-bottom: 22px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), #45b7d1); transition: width .3s ease; }
  .q-cat { display: inline-block; background: #eefbfa; color: #16897f; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }
  .q-text { font-size: 21px; font-weight: 700; margin: 0 0 6px; line-height: 1.35; }
  .q-flag { font-size: 64px; text-align: center; margin: 14px 0; line-height: 1; }
  .options { display: grid; gap: 10px; margin-top: 18px; }
  .opt-btn {
    border: 2px solid #e6e9ef; background: #fff; border-radius: 12px;
    padding: 14px 16px; font-size: 15px; font-weight: 600; text-align: left;
    cursor: pointer; transition: all .12s ease;
  }
  .opt-btn:hover:not(:disabled) { border-color: #45b7d1; background: #f4fbfd; }
  .opt-btn.correct { border-color: var(--correct); background: #eafff3; color: #1a8f4c; }
  .opt-btn.wrong { border-color: var(--wrong); background: #fff0ef; color: #c0392b; }
  .opt-btn:disabled { cursor: default; }
  .next-wrap { margin-top: 20px; text-align: right; min-height: 44px; }
  .next-btn {
    border: none; border-radius: 10px; background: var(--bg2); color: #fff;
    font-weight: 700; padding: 12px 22px; font-size: 14px; cursor: pointer;
  }

  /* ---- End screen ---- */
  .score-big { text-align: center; font-size: 52px; font-weight: 800; margin: 6px 0 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .score-sub { text-align: center; color: var(--muted); font-weight: 600; margin-bottom: 18px; }
  .review-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f1f5; font-size: 14px; }
  .review-item .mark { font-size: 16px; }
  .review-item .qtext { flex: 1; }
  .review-item .ans { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn-row button {
    flex: 1; border: none; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .btn-row .again { background: linear-gradient(135deg, var(--accent), #ff9068); color: #fff; }
  .btn-row .menu { background: #f0f1f5; color: var(--text); }
  .hidden { display: none !important; }
  .muted-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }
</style>
</head>

<div class="wrap">

    <div id="reviewList"></div>
    <div class="btn-row">

</div>

const CATEGORIES = [
  { key: "mixed",    label: "Mixed (All)",    emoji: "🎲" },
  { key: "flag",      label: "Flags",          emoji: "🚩" },
  { key: "capital",   label: "Capitals",       emoji: "🏛️" },
  { key: "landmark",  label: "Landmarks",      emoji: "🗼" },
  { key: "food",      label: "Food",           emoji: "🍽️" },
  { key: "language",  label: "Language",       emoji: "💬" },
  { key: "tradition", label: "Traditions",     emoji: "🎉" },
  { key: "historic",  label: "Historic Sites", emoji: "🏺" },
];

const QUESTION_BUILDERS = {
  flag: (c) => ({
    cat: "Flags",
    text: "Which country does this flag belong to?",
    flag: c.flag,
    correct: c.name,
    pool: COUNTRIES.map(x => x.name),
  }),
  capital: (c) => ({
    cat: "Capitals",
    text: `What is the capital of ${c.name}?`,
    correct: c.capital,
    pool: COUNTRIES.map(x => x.capital),
  }),
  landmark: (c) => ({
    cat: "Landmarks",
    text: `Which country is home to ${c.landmark}?`,
    correct: c.name,
    pool: COUNTRIES.map(x => x.name),
  }),
  food: (c) => ({
    cat: "Food",
    text: `Which country does ${c.food} traditionally come from?`,
    correct: c.name,
    pool: COUNTRIES.map(x => x.name),
  }),
  language: (c) => ({
    cat: "Language",
    text: `What is the main language of ${c.name}?`,
    correct: c.language,
    pool: COUNTRIES.map(x => x.language),
  }),
  tradition: (c) => ({
    cat: "Traditions",
    text: `Which country celebrates or practices: ${c.tradition}?`,
    correct: c.name,
    pool: COUNTRIES.map(x => x.name),
  }),
  historic: (c) => ({
    cat: "Historic Sites",
    text: `Which country is home to ${c.historic}?`,
    correct: c.name,
    pool: COUNTRIES.map(x => x.name),
  }),
};

const FIELD_KEYS = Object.keys(QUESTION_BUILDERS);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestion(category) {
  const key = category === "mixed" ? FIELD_KEYS[Math.floor(Math.random() * FIELD_KEYS.length)] : category;
  const country = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
  const q = QUESTION_BUILDERS[key](country);

  const distractorPool = Array.from(new Set(q.pool.filter(v => v !== q.correct)));
  const distractors = shuffle(distractorPool).slice(0, 3);
  const options = shuffle([q.correct, ...distractors]);

  return {
    cat: q.cat,
    text: q.text,
    flag: q.flag || null,
    options,
    correct: q.correct,
  };
}

// ---------------- State ----------------
let selectedCategory = "mixed";
let selectedLength = 10;
let questions = [];
let currentIndex = 0;
let score = 0;
let missed = [];
let answered = false;

// ---------------- Start screen ----------------
const catGrid = document.getElementById("catGrid");
const lenGrid = document.getElementById("lenGrid");

CATEGORIES.forEach(c => {
  const btn = document.createElement("button");
  btn.className = "cat-btn" + (c.key === selectedCategory ? " active" : "");
  btn.innerHTML = `<span class="emoji">${c.emoji}</span><span>${c.label}</span>`;
  btn.addEventListener("click", () => {
    selectedCategory = c.key;
    [...catGrid.children].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
  catGrid.appendChild(btn);
});

[10, 20, 30, 50].forEach(n => {
  const btn = document.createElement("button");
  btn.className = "len-btn" + (n === selectedLength ? " active" : "");
  btn.textContent = n + " Qs";
  btn.addEventListener("click", () => {
    selectedLength = n;
    [...lenGrid.children].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  });
  lenGrid.appendChild(btn);
});

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", startGame);
document.getElementById("menuBtn").addEventListener("click", () => {
  showScreen("start");
});
document.getElementById("exitBtn").addEventListener("click", () => {
  const midway = currentIndex > 0 && currentIndex < questions.length;
  if (midway && !confirm("Exit this game and return home? Your current progress will be lost.")) {
    return;
  }
  showScreen("start");
});

function showScreen(name) {
  document.getElementById("screen-start").classList.toggle("hidden", name !== "start");
  document.getElementById("screen-quiz").classList.toggle("hidden", name !== "quiz");
  document.getElementById("screen-end").classList.toggle("hidden", name !== "end");
}

function startGame() {
  questions = [];
  for (let i = 0; i < selectedLength; i++) questions.push(buildQuestion(selectedCategory));
  currentIndex = 0;
  score = 0;
  missed = [];
  showScreen("quiz");
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[currentIndex];
  document.getElementById("qCounter").textContent = `Question ${currentIndex + 1} / ${questions.length}`;
  document.getElementById("scoreLive").textContent = `Score: ${score}`;
  document.getElementById("progressFill").style.width = `${(currentIndex / questions.length) * 100}%`;
  document.getElementById("qCatLabel").textContent = q.cat;
  document.getElementById("qText").textContent = q.text;

  const flagEl = document.getElementById("qFlag");
  if (q.flag) {
    flagEl.textContent = q.flag;
    flagEl.classList.remove("hidden");
  } else {
    flagEl.classList.add("hidden");
  }

  const wrap = document.getElementById("optionsWrap");
  wrap.innerHTML = "";
  q.options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "opt-btn";
    b.textContent = opt;
    b.addEventListener("click", () => selectAnswer(opt, b));
    wrap.appendChild(b);
  });

  document.getElementById("nextBtn").classList.add("hidden");
}

function selectAnswer(opt, btnEl) {
  if (answered) return;
  answered = true;
  const q = questions[currentIndex];
  const allBtns = [...document.getElementById("optionsWrap").children];
  const isCorrect = opt === q.correct;

  if (isCorrect) {
    score++;
    btnEl.classList.add("correct");
  } else {
    btnEl.classList.add("wrong");
    allBtns.forEach(b => { if (b.textContent === q.correct) b.classList.add("correct"); });
    missed.push({ text: q.text, correct: q.correct, chosen: opt });
  }
  allBtns.forEach(b => b.disabled = true);
  document.getElementById("scoreLive").textContent = `Score: ${score}`;
  document.getElementById("nextBtn").classList.remove("hidden");
}

document.getElementById("nextBtn").addEventListener("click", () => {
  currentIndex++;
  if (currentIndex >= questions.length) {
    endGame();
  } else {
    renderQuestion();
  }
});

function endGame() {
  document.getElementById("progressFill").style.width = "100%";
  showScreen("end");
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById("finalScore").textContent = `${score}/${questions.length}`;
  let msg;
  if (pct === 100) msg = "Perfect score! You're a geography champion! 🏆";
  else if (pct >= 80) msg = "Excellent! You really know your countries. 🌟";
  else if (pct >= 60) msg = "Good job! Solid geography knowledge. 👍";
  else if (pct >= 40) msg = "Not bad — keep exploring the world! 🗺️";
  else msg = "Keep playing to learn more about the world! 🌱";
  document.getElementById("finalMsg").textContent = `${pct}% — ${msg}`;

  const reviewList = document.getElementById("reviewList");
  reviewList.innerHTML = "";
  if (missed.length === 0) {
    const p = document.createElement("p");
    p.style.textAlign = "center";
    p.style.color = "#636e72";
    p.textContent = "You answered every question correctly!";
    reviewList.appendChild(p);
  } else {
    const label = document.createElement("div");
    label.className = "row-label";
    label.textContent = "Review missed questions";
    reviewList.appendChild(label);
    missed.forEach(m => {
      const item = document.createElement("div");
      item.className = "review-item";
      item.innerHTML = `<span class="mark">❌</span><div class="qtext">${m.text}<div class="ans">Your answer: ${m.chosen} — Correct: ${m.correct}</div></div>`;
      reviewList.appendChild(item);
    });
  }
}
</script>
</body>
</html>
